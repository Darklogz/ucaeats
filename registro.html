<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Registro</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>
  <div class="card">
    <h2>Registro de usuario</h2>

    <form action="registrar.php" method="post" onsubmit="return validarFormulario()">

      <label>Usuario:</label>
      <input type="text" name="usuario" id="usuario" 
        required 
        pattern="[A-Za-z0-9]+" 
        title="Solo se permiten letras y números." />

      <label>Contraseña:</label>
      <input type="password" name="password" id="password" required />

      <label>Teléfono:</label>
      <input type="tel" name="telefono" id="telefono"
        required
        pattern="[0-9]+"
        title="Solo se permiten números." />

      <div class="botones-columna">

        <button class="button btn-azul" type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75" />
          </svg>
          <div class="text">Registrar</div>
        </button>

        <a href="login.html" class="button btn-rojo">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15m0 0l6.75-6.75M4.5 12l6.75 6.75" />
          </svg>
          <div class="text">Volver</div>
        </a>

      </div>
    </form>
  </div>

<script>
function validarFormulario() {
    const usuario = document.getElementById("usuario").value;
    const telefono = document.getElementById("telefono").value;

    const regexUsuario = /^[A-Za-z0-9]+$/;
    const regexTelefono = /^[0-9]+$/;

    if (!regexUsuario.test(usuario)) {
        alert("El usuario solo puede contener letras y números.");
        return false;
    }

    if (!regexTelefono.test(telefono)) {
        alert("El teléfono solo puede contener números.");
        return false;
    }

    return true;
}
</script>

</body>
</html>
